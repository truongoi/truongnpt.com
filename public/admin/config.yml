# Sveltia CMS configuration — admin lives at https://truongnpt.com/admin/
# Sign in with a GitHub personal access token ("Sign In with Token").
# Media: the Asset Library browses everything under public/images.
# Each collection uploads into its own subfolder.

backend:
  name: github
  repo: truongoi/truongnpt.com
  branch: main

media_folder: public/images
public_folder: /images

collections:
  - name: posts
    label: Posts
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    media_folder: /public/images/posts
    public_folder: /images/posts
    sortable_fields:
      fields: [title, pubDate]
      default:
        field: pubDate
        direction: descending
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Publish Date, name: pubDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Hero Image, name: heroImage, widget: image, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false, hint: "On hides this from the site" }
      - { label: Body, name: body, widget: markdown }

  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    media_folder: /public/images/projects
    public_folder: /images/projects
    sortable_fields:
      fields: [title, pubDate]
      default:
        field: pubDate
        direction: descending
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Publish Date, name: pubDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Subtitle, name: subtitle, widget: string, required: false }
      - { label: Hero Image, name: heroImage, widget: image, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false, hint: "On hides this from the site" }
      - { label: Body, name: body, widget: markdown }

  - name: pages
    label: Pages
    folder: src/content/pages
    create: false
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Body, name: body, widget: markdown }

  - name: settings
    label: Site Settings
    files:
      - name: general
        label: General
        file: src/site-settings.json
        fields:
          - { label: "Show Projects section", name: showProjects, widget: boolean, default: true, hint: "Off hides the Projects nav link and homepage section" }
          - { label: Site Title, name: siteTitle, widget: string, hint: "Browser tab, logo, page titles" }
          - { label: Site Description, name: siteDescription, widget: text, hint: "Default meta description for Google" }
          - { label: Contact Form Endpoint, name: contactFormEndpoint, widget: string, hint: "Formspree endpoint, e.g. https://formspree.io/f/xxxx" }
          - { label: Logo Mark, name: logoMark, widget: string, hint: "The letter in the logo box" }
          - { label: Logo Text, name: logoText, widget: string }
          - { label: Hero Eyebrow, name: heroEyebrow, widget: string }
          - { label: Hero Name, name: heroName, widget: string }
          - { label: Hero Name Highlight, name: heroNameHighlight, widget: string, hint: "Highlighted in green" }
          - { label: Hero Lead, name: heroLead, widget: text }
          - { label: Hero Image, name: heroImage, widget: image, required: false }
          - { label: Hero Caption, name: heroCaption, widget: string, required: false }
          - { label: Primary Button Label, name: heroCtaPrimaryLabel, widget: string }
          - { label: Primary Button Link, name: heroCtaPrimaryHref, widget: string }
          - { label: Secondary Button Label, name: heroCtaSecondaryLabel, widget: string }
          - { label: Secondary Button Link, name: heroCtaSecondaryHref, widget: string }
          - { label: CTA Title, name: ctaTitle, widget: string, hint: "The 'Say hello' card on the homepage" }
          - { label: CTA Text, name: ctaText, widget: text }
          - { label: CTA Button Label, name: ctaButtonLabel, widget: string }
          - { label: CTA Button Link, name: ctaButtonHref, widget: string }
          - { label: Footer About, name: footerAbout, widget: text }
          - label: Footer Explore Links
            name: footerExploreLinks
            widget: list
            hint: "Blog and Projects links are added automatically"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: href, widget: string }
          - label: Footer Social Links
            name: footerSocialLinks
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: href, widget: string }
      - name: profile_links
        label: Profile Links
        file: src/profile-links.json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Tagline, name: tagline, widget: string, required: false }
          - { label: Avatar, name: avatar, widget: image, required: false }
          - label: Links
            name: links
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Subtitle, name: sub, widget: string, required: false }
              - { label: URL, name: href, widget: string }
              - { label: Icon (emoji), name: badge, widget: string, required: false }
              - label: Color
                name: color
                widget: select
                options:
                  - { label: Default, value: "" }
                  - { label: Green, value: btn-green }
                  - { label: Blue, value: btn-blue }
                  - { label: Yellow, value: btn-yellow }
